        - heading "What is Airplanes.live?" [level=2] [ref=f90e52]
        - generic [ref=f90e53]:
          - paragraph [ref=f90e54]: Airplanes.live is a community-run ADS-B aggregator. Receivers built and hosted by enthusiasts pick up ADS-B (Automatic Dependent Surveillance-Broadcast) and MLAT (Multilateration) signals from the aircraft overhead, and the combined feed shows what is flying in your area right now. Enthusiasts, researchers and journalists can use that data however they like.
          - paragraph [ref=f90e55]:
            - text: Airplanes.live will never filter or obfuscate aircraft data. Every
            - link "feeder" [ref=f90e56] [cursor=pointer]:
              - /url: /get-started/
            - text: gets the unfiltered MLAT results back.
          - paragraph [ref=f90e57]: Whether you're a plane spotter or simply curious about the skies above, the map shows the traffic as the receivers actually heard it.
          - paragraph [ref=f90e58]: "Airplanes.live is free to use: follow global air traffic, watch the military aircraft that many flight radar sites filter out, and track any plane in real time on the live map."
