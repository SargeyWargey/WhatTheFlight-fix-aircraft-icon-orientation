                  - heading "1. Terms" [level=2] [ref=f66e92]
                  - paragraph [ref=f66e93]:
                    - text: 1.1 Flightradar24 AB (hereinafter "
                    - strong [ref=f66e94]: Flightradar24
                    - text: "\", \""
                    - strong [ref=f66e95]: we
                    - text: "\", \""
                    - strong [ref=f66e96]: us
                    - text: "\", or \""
                    - strong [ref=f66e97]: our
                    - text: "\"), registration no. 556895-1213, having its registered address at Brunnsgatan 13, 111 38 Stockholm, Sweden, provides real-time flight tracking of air traffic throughout the world, accessible by using our website, currently www.flightradar24.com (the \""
                    - strong [ref=f66e98]: Website
                    - text: "\"), our mobile applications (the \""
                    - strong [ref=f66e99]: Apps
                    - text: "\"), Premium Services and the Flightradar24 API (the \""
                    - strong [ref=f66e100]: FR24 API
                    - text: "\"), (as further defined below) or other information provided as part of Flightradar24’s services (collectively the \""
                    - strong [ref=f66e101]: Services
                    - text: "\"). Purchasers of the Service are referred to as \""
                    - strong [ref=f66e102]: you
                    - text: "\" or the \""
                    - strong [ref=f66e103]: User
                    - text: "\"."
                  - paragraph [ref=f66e104]: 1.2 These Terms of Service (the "Terms") set forth the legally binding terms and conditions governing any use of the Services provided by Flightradar24. By using the Services, you acknowledge your understanding of, and agreement to, these Terms, which also incorporate our Privacy Policy. Any use of the Services is subject to these Terms.
                  - paragraph [ref=f66e105]: 1.3 Please read these Terms carefully before using the Services. If you do not agree to these Terms, you do not have the right to use the Services.
                - generic [ref=f66e107]:
                  - heading "2. Rights to use" [level=2] [ref=f66e108]
                  - paragraph [ref=f66e109]: 2.1 Subject to your compliance with these Terms, we grant you a non-exclusive, non-transferable limited right to access and use the Services. Unless otherwise stated in these Terms, specifically Clause 5.3 and 6.3, this right is granted only for personal, non-commercial use.
                  - paragraph [ref=f66e110]: 2.2 Nothing in these Terms shall be interpreted as a transfer of title to the Services.
                  - paragraph [ref=f66e111]: 2.3 With the exception of the FR24 API, you may only access the Services via a human-operated web browser or mobile application, and not with any program, collection agent, or “robot” for any purpose, including the purpose of automated retrieval, display of content or “scraping” of data or information.
                  - paragraph [ref=f66e112]: 2.4 Within the FR24 API, you can temporarily cache or store retrieved data for a limited time as documented per endpoint within the API Portal, after which you must delete the cached values.
                  - paragraph [ref=f66e113]: 2.5 This right to access and use the Services shall automatically terminate if you violate any provision of these Terms. Upon the termination of this right to use the Services, you must destroy any downloaded information accessed via the Services, whether in electronic or printed format.
                - generic [ref=f66e115]:
                  - heading "3. Registration process and User Account Security" [level=2] [ref=f66e116]
                  - paragraph [ref=f66e117]: 3.1 Users of the Services can register an account with Flightradar24 to use and access additional functionality of the Services. Full descriptions of the content of each Service can be found on our Website.
                  - paragraph [ref=f66e118]: 3.2 If you are a physical person, you must be over 18 years of age to register an account for the Services.
                  - paragraph [ref=f66e119]: 3.3 During registration, you will be asked to provide your email address and password. Alternatively, you can use certain single sign-on services provided by third parties. For some subscription levels, you are asked to provide a company name and may also have to provide a business address and VAT number.
                  - paragraph [ref=f66e120]:
                    - text: 3.4 You are responsible for providing accurate and correct registration information and we assume no liability for any error, inaccuracy, or omission in such information or in the Service resulting from any information provided by you. By becoming a registered user of our Services, you will also be prompted to give your consent to our processing of your personal data in accordance with our
                    - link "Privacy Policy" [ref=f66e121] [cursor=pointer]:
                      - /url: https://www.flightradar24.com/privacy-policy
                    - text: .
                  - paragraph [ref=f66e122]: 3.5 You are personally and solely responsible for all activities that occur using your unique account subscription credentials and assume full responsibility for your use of the Services. You are responsible for maintaining the confidentiality of your password and you should ensure that you exit properly from your account at the end of each session. You agree to notify Flightradar24 immediately if you suspect any unauthorised use of your account or access to your password or account. You may not disguise the origin of your connection to the Services, or provide false or inaccurate information to Flightradar24. You shall not misrepresent yourself, your identity, or your affiliations in connection with the use of the Services. This includes not falsely claiming any endorsement or partnership with Flightradar24.
                  - paragraph [ref=f66e123]:
                    - code [ref=f66e124]: 3.6 Other than as explicitly permitted directly by a representative of Flightradar24, it is strictly prohibited to resell, sublicense, lease or otherwise commercially redistribute service account subscriptions, access credentials, and in the case of the FR24 API, API tokens.
                  - paragraph [ref=f66e125]: 3.7 If you wish to deactivate your account, write to us via our Contact Us page.
                - generic [ref=f66e127]:
