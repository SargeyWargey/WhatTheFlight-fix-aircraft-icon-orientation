                  - paragraph [ref=f66e129]: 4.1 Certain Website and App related Services from Flightradar24 are offered free of charge. These are referred to as the "Basic (free) Service".
                - generic [ref=f66e131]:
                  - heading "5. Premium Services" [level=2] [ref=f66e132]
                  - heading "5.1 Premium Services levels" [level=3] [ref=f66e133]
                  - paragraph [ref=f66e134]: 5.1.1 The Premium Services include subscriptions to our Website and Apps. Users of the Premium Services are required to register an account.
                  - paragraph [ref=f66e135]:
                    - text: "5.1.2 The Premium Services are divided into three subscription levels: \""
                    - strong [ref=f66e136]: Silver
                    - text: "\", \""
                    - strong [ref=f66e137]: Gold
                    - text: "\" and \""
                    - strong [ref=f66e138]: Business
                    - text: "\". Each subscription level grants access to different features, functionalities, performance and priority of support for the Premium Services as documented on the Website, or as separately agreed between the parties."
                  - heading "5.2 Subscription Term and Termination" [level=3] [ref=f66e139]
                  - paragraph [ref=f66e140]: 5.2.1 Premium Services are entered into for a subscription period as specified on the Website, or, for such period as separately agreed between the parties. All account subscriptions are automatically extended by an additional subscription period until you or Flightradar24 terminates the subscription. Please see your relevant account page for more information about your Premium Service subscription.
                  - paragraph [ref=f66e141]: 5.2.2 By purchasing the Premium Service as a consumer, you expressly consent to the commencement and fulfilment of the Premium Service by Flightradar24 and acknowledge that there is no right of withdrawal for the Premium Service.
                  - paragraph [ref=f66e142]: 5.2.3 You may at any time terminate your Premium Service subscription before the start of the additional subscription period, via your relevant account page. No subscription fees paid in advance for the relevant period will be repaid, but you will have the right to continue to use the Services until the end of that period.
                  - paragraph [ref=f66e143]: 5.2.4 Premium Service subscriptions can be terminated by Flightradar24 at any time if any use in violation of these Terms is detected or suspected.
                  - paragraph [ref=f66e144]: 5.2.5 If any amount owed by the User to Flightradar24 under these Terms or under any other agreement between the User and Flightradar24 remains unpaid after the applicable due date and after any required notice period, unless such amount is subject to a bona fide dispute raised by the User in writing, including reasonable details of the basis for the dispute, Flightradar24 may, without liability and in addition to any other rights or remedies available to it, suspend or restrict access to any or all Services, user accounts, subscriptions, API access, products, or services provided by Flightradar24 until all outstanding amounts have been paid in full.
                  - heading "5.3 Commercial Use" [level=3] [ref=f66e145]
                  - paragraph [ref=f66e146]:
                    - text: 5.3.1 Within the Premium Services, the Business level subscription is the only subscription whereby a user is allowed to use the Paid Services in relation to any commercial use or for any commercial purposes including use within any commercial or governmental organisation or for any public display (commercial or non-commercial). Therefore, if you intend to make any commercial use or any use of the Premium Services within a professional or public environment, you must subscribe to our Business level subscription, whereby the right to use granted in clause 2.1 will, further to what is set out therein, also give you a right to use the Premium Services for commercial purposes. Flightradar24 reserves the right to temporarily suspend "
                    - strong [ref=f66e147]: Silver
                    - text: "\" and \""
                    - strong [ref=f66e148]: Gold
                    - text: "\" Premium Service accounts where commercial use is suspected or detected."
                - generic [ref=f66e150]:
                  - heading "6. FR24 API" [level=2] [ref=f66e151]
                  - heading "6.1 FR24 API levels" [level=3] [ref=f66e152]
                  - paragraph [ref=f66e153]:
                    - text: "6.1.1 The FR24 API is also divided into three subscription levels: \""
                    - strong [ref=f66e154]: Explorer
                    - text: "\", \""
                    - strong [ref=f66e155]: Essential
                    - text: "\" and \""
                    - strong [ref=f66e156]: Advanced
                    - text: "\"."
                  - heading "6.2 Subscription Term and Termination" [level=3] [ref=f66e157]
                  - paragraph [ref=f66e158]: 6.2.1 FR24 Subscriptions are entered into for a subscription period as specified on the Website, or, for such period as separately agreed between the parties. All account subscriptions are automatically extended by an additional subscription period until you or Flightradar24 terminates the subscription. Please see your relevant account page for more information about your FR24 API subscription.
                  - paragraph [ref=f66e159]: 6.2.2 By purchasing the FR24 API as a consumer, you expressly consent to the commencement and fulfilment of the FR24 API by Flightradar24 and acknowledge that there is no right of withdrawal for the FR24 API.
                  - paragraph [ref=f66e160]: 6.2.3 You may at any time terminate your FR24 API subscription before the start of the additional subscription period, via your relevant account page. No subscription fees paid in advance for the relevant period will be repaid, but you will have the right to continue to use the Services until the end of that period.
                  - paragraph [ref=f66e161]: 6.2.4 FR24 API subscriptions can be terminated by Flightradar24 at any time if any use in violation of these Terms is detected or suspected.
                  - heading "6.3 Commercial Use" [level=3] [ref=f66e162]
                  - paragraph [ref=f66e163]: 6.3.1 Commercial use and the creation of derivative works from data sourced via the FR24 API is permitted at each subscription level in line with the limitation specified below, and in conjunction with these Terms and any other legal notices as documented within the FR24 API Portal, including but not limited to specified caching restrictions.
                  - list [ref=f66e164]:
                    - listitem [ref=f66e165]: "Data Resale and Manipulation You are prohibited from reselling, transferring, redistributing, lending, leasing, sublicensing or manipulating raw data accessed via the FR24 API. This includes, but is not limited to:"
                    - list [ref=f66e166]:
                      - listitem [ref=f66e167]: Selling or transferring enriched datasets which contain raw FR24 data.
                      - listitem [ref=f66e168]: Manipulating, modifying, or obfuscating any FR24 API data in an attempt to materially change the raw, original content and integrity of the data, or mask the origins of the data sourced from the FR24 API.
                      - listitem [ref=f66e169]: Using the FR24 API to supplement or backfill any other near-time or real-time flight data sourced from an alternative data provider for any commercial or non-commercial use.
                    - listitem [ref=f66e170]: "Competitive harm and misrepresentation You are prohibited from using the data accessed via the FR24 API to competitively harm Flightradar24, which includes but is not limited to:"
                    - list [ref=f66e171]:
                      - listitem [ref=f66e172]: Identifying market trends to leverage against our business.
                      - listitem [ref=f66e173]: Developing competing services or products based on the information or insights gathered from our data.
                      - listitem [ref=f66e174]: Removing any Flightradar24 or third-party names, trademarks, copyright notices or other proprietary rights notices.
                    - listitem [ref=f66e175]: "Unauthorised Data Storage You are prohibited from storing the data accessed via the FR24 API beyond the storage restrictions specified in our API documentation. This includes, but is not limited to:"
                    - list [ref=f66e176]:
                      - listitem [ref=f66e177]: Creating persistent local copies of the data.
                      - listitem [ref=f66e178]: Storing data on external servers or cloud services not affiliated with the storage rules.
                    - listitem [ref=f66e179]: "Flight-Critical or Flight Decision-Making Applications You are explicitly prohibited from using the data accessed via the FR24 API for any flight-critical or safety-critical decisions. This includes, but is not limited to:"
                    - list [ref=f66e180]:
                      - listitem [ref=f66e181]: Systems that support or make critical or navigation-based decisions related to air traffic control, flight planning, or flight operations.
                      - listitem [ref=f66e182]: Any use in software or systems that directly impact the safety, operation, or management of aircraft in flight.
                  - paragraph [ref=f66e183]: 6.3.2 Notwithstanding the above, the User is entitled to enrich and create derivative data set from the data for commercial purposes, subject to such enrichment and creation will be done by the User by adding significant value to the data and/or the data itself not being the main selling point.
                - generic [ref=f66e185]:
                  - heading "7. Fees and Payment" [level=2] [ref=f66e186]
                  - heading "7.1 Basic (free) Services" [level=3] [ref=f66e187]
                  - paragraph [ref=f66e188]: 7.1.1 No fees will be charged for the Basic (free) Services.
                  - 'heading "7.2 Premium Services: Silver, Gold, and Business Subscriptions" [level=3] [ref=f66e189]'
                  - paragraph [ref=f66e190]: 7.2.1 Premium Services can be purchased on the Website, or through so-called in-app purchases in some of our Apps.
                  - paragraph [ref=f66e191]: 7.2.2 Premium Services shall be paid in advance in accordance with the price list applicable from time to time which is available on the Website or Apps. Applicable VAT is presented at the time of purchase depending on your location and classification as a private individual or a commercial entity. You may affect payment of the fee through any of the means of payment offered by us on the Website or in one of our Apps.
                  - paragraph [ref=f66e192]: 7.2.3 If any payment is not made by the due date, your Premium Service subscription will automatically terminate at the end of your active Subscription Period. You are responsible for providing accurate and up-to-date billing information. Failure to provide accurate billing information may result in the suspension or termination of your subscription.
                  - 'heading "7.3 FR24 API: Subscriptions and API Credits" [level=3] [ref=f66e193]'
                  - paragraph [ref=f66e194]: 7.3.1 Subscriptions to the FR24 API are available in accordance with the price list applicable from time to time which is available on the Website.
                  - paragraph [ref=f66e195]: 7.3.2 Full usage of the FR24 API is subject to the User’s holding of credits which are used for each call to an endpoint (“API Credits”). The API Credits can be purchased within the API Portal on the Website. API Credits have a limited validity, as specified in the User’s FR24 API Account. Unused credits will expire at the end of their validity period and will not be refunded or carried over. Users have the option to set automatic top-ups of their API Credit accounts, to their chosen amount and up to the overall limit set by Flightradar24. Flightradar24 reserves the right to change this overall credit top-up limit from time to time. Users are solely responsible for ensuring that this functionality is enabled or disabled as required for their use. Flightradar24 will not be held accountable for any automatic top-ups that occur where such functionality has been set by the User and will not refund such amounts.
                  - paragraph [ref=f66e196]: 7.3.3 The use of API Credits is dependent on the User having an active FR24 API subscription. Should an FR24 API Subscription payment not be made by the due date, the subscription will enter into a grace period of 3 days, during which Flightradar24 will attempt to authorise the payment. If the payment is not received by the end of the 3-day period, the subscription will be considered inactive, and the User will not be able to use any API Credits until the subscription is reactivated. Should an FR24 API User account be terminated, any remaining API Credits will become unusable and will not be refunded.
                  - heading "7.4 Changes to the Fees" [level=3] [ref=f66e197]
                  - paragraph [ref=f66e198]: 7.4.1 Flightradar24 may change the prices for the Premium Services and the FR24 API from time to time and will notify you of any such price changes and the timing thereof through information posted on our Website at least thirty (30) days before such change taking place. Any price change communicated will be applicable for the following subscription period.
                  - paragraph [ref=f66e199]: 7.4.2 As permitted by law, you accept the new price by continuing to use the Premium Services and the FR24 API after the price change takes effect. If you do not agree with the price changes, you have the right to reject the change by terminating the Premium Services or FR24 API prior to the price change going into effect. Please therefore make sure you read any such notification of price changes carefully.
                - generic [ref=f66e201]:
                  - heading "8. Unauthorised Use/No Interference" [level=2] [ref=f66e202]
                  - paragraph [ref=f66e203]: "8.1 You agree that you will not use or attempt to use any method, device, software, or routine to harm others or interfere with functioning of the Services or use and/or monitor any information in or related to the Services for any unauthorised purpose. Specifically, each user, whether authorised or unauthorised, agrees that it will not (and will not permit any of its employees, agents, and any other third party to) do any of the following:"
                  - list [ref=f66e204]:
                    - listitem [ref=f66e205]: Use the Services or any information data or content contained therein to provide, link, or otherwise make available, any information on the Services that is unlawful, threatening, abusive, harassing, torturous, defamatory, vulgar, obscene, libelous, invasive of another’s privacy, hateful, harmful to minors or racially, ethnically or otherwise objectionable.
                    - listitem [ref=f66e206]: Impersonate any person or entity, or otherwise misrepresent your affiliation.
                    - listitem [ref=f66e207]: Manipulate, forge, or otherwise modify information or identifiers in a manner that may hide or disguise the origin of any information.
                    - listitem [ref=f66e208]: Modify, reverse engineer, reverse assemble, decompile, or hack into any of the software applications or related tools or utilities used by the Services.
                    - listitem [ref=f66e209]: Alter or delete information not provided by you, or interfere with the operation of the Services including, but not limited to, by distribution of unsolicited advertising or mail messages or propagation of worms, viruses, and the like.
                    - listitem [ref=f66e210]: Use the Services for anything that may materially damage the reputation of Flightradar24.
                  - paragraph [ref=f66e211]: 8.2 By using the Services, you affirm that all commercial products, published material, or other use of the information content that is otherwise made publicly or commercially available, if any, shall clearly reference and credit Flightradar24.
                  - paragraph [ref=f66e212]: 8.3 You also agree not to permit any other user of the Services to access, view, download, or reproduce any available information or material for any use not permitted by us. Flightradar24 reserves the right to monitor usage patterns and enforce compliance with the specified usage limits and limitations, for the purpose of analysis, auditing, and improving the Services. Unauthorised attempts to bypass or circumvent these limits or limitations are strictly prohibited and failure to adhere may result in revoked or blocked access to the Services. Users must not engage in any activity that may disrupt or interfere with the functioning of the FR24 API or any of Flightradar24's systems.
                  - paragraph [ref=f66e213]: 8.4 Should you become aware of any unauthorised or unlawful activities related to the usage of the FR24 API or violation of these Terms, you are encouraged to report such information to Flightradar24 via our website as soon as you become aware of such unauthorised or unlawful activities or violations.
