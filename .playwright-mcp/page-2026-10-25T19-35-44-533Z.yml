          - heading "About TheAirTraffic" [level=2] [ref=f84e36]
          - paragraph [ref=f84e38]: TheAirTraffic is a global flight tracking website created by Ground Control. We launched in early 2023 to provide unrestricted air traffic data, both real-time and historical, to users. We are committed to sharing data and providing an opportunity for others to learn from it. TheAirTraffic powers Ground Control's wide family of flight bots. Our flight tracking aims to take the best of the easy to use flight tracking websites and combine it with the ability to track any aircraft. Then anyone can easily track any aircraft!
