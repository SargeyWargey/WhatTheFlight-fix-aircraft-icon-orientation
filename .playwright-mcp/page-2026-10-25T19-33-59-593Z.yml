            - code [ref=f59e199]:
              - text: "import json import requests import firebase_admin from firebase_admin import credentials, firestore from functools import wraps from datetime import datetime, timedelta # Define storage duration in days (30 days) STORAGE_DURATION_DAYS = 30 # Initialize firebase admin SDK cred = credentials.Certificate(\"path/to/your/firebase-adminsdk-key.json\") firebase_admin.initialize_app(cred) db = firestore.client() # Helper function to make requests def make_request(url, headers): response = requests.get(url, headers=headers) response.raise_for_status() return response.json() # Wrapper to enforce storage rules def enforce_storage_rules(endpoint_func): @wraps(endpoint_func) def wrapper(*args, **kwargs): data = endpoint_func(*args, **kwargs) endpoint_name = endpoint_func.__name__.replace('get_', '') save_data_to_firestore(endpoint_name, data) return data return wrapper # Function to save data to Firestore with TTL def save_data_to_firestore(collection_name, data): timestamp = datetime.utcnow() ttl_timestamp = timestamp + timedelta(days=STORAGE_DURATION_DAYS) db.collection(collection_name).add({ 'data': data, 'created_at': timestamp, 'ttl': ttl_timestamp }) print("
