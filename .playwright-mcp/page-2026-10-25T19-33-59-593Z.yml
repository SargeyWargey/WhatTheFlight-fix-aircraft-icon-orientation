            - heading "Storage rules" [level=2] [ref=f59e148]
            - paragraph [ref=f59e149]:
              - text: "All endpoints have the same storage duration rule:"
              - strong [ref=f59e150]: All data accumulated from the FR24 API should not be stored for more than 30 days from the date it was first received. After this period, all stored data must be permanently deleted.
            - heading "Example implementations" [level=2] [ref=f59e151]
            - heading "Local storage with cleanup script" [level=3] [ref=f59e152]
