        - generic [ref=f80e82]:
          - paragraph [ref=f80e83]:
            - text: Commercial use is allowed on
            - strong [ref=f80e84]: every plan, Free included
            - text: ", within the plan’s limits. That covers apps and devices you sell too, with no separate agreement: the"
            - link "terms" [ref=f80e85] [cursor=pointer]:
              - /url: /en/terms/
            - text: apply.
          - heading "Apps and devices" [level=2] [ref=f80e86]
          - list [ref=f80e87]:
            - listitem [ref=f80e88]:
              - strong [ref=f80e89]: One key per product
              - text: ", not one per device or per customer. Requests from all devices count together on that key, from any IP."
            - listitem [ref=f80e90]:
              - strong [ref=f80e91]: A server of your own with a cache
              - text: "that serves only your devices is fine: it isn’t redistribution, and it lowers your request count."
            - listitem [ref=f80e92]: A key inside an app or firmware can be extracted. If that worries you, use it only from your server.
          - heading "Sizing the plan" [level=2] [ref=f80e93]
          - paragraph [ref=f80e94]: "Multiply one device’s requests by the number of devices. For example, 10 devices asking 12 times a minute, day and night, make 120 requests a minute and over 5 million a month: the Pro plan. A single device at 12 requests a minute already goes past the Free plan’s 300,000 a month."
          - list [ref=f80e95]:
            - listitem [ref=f80e96]: Asking every 15 seconds instead of every 5 cuts usage by three.
            - listitem [ref=f80e97]: With a cache on your server, many devices in the same area cost as much as one.
          - paragraph [ref=f80e98]:
            - text: The plans are on
            - link "REST API" [ref=f80e99] [cursor=pointer]:
              - /url: /en/data/api/#piani
            - text: . The key you already have moves to the new plan without changing.
          - heading "Attribution and licence" [level=2] [ref=f80e100]
          - paragraph [ref=f80e101]:
            - text: The data is
            - link "CC BY-SA 4.0" [ref=f80e102] [cursor=pointer]:
              - /url: https://creativecommons.org/licenses/by-sa/4.0/
            - text: ". Credit FlyItalyADSB with a link to flyitalyadsb.com where users see it: in the app, on the device or in the manual, on the product page. For example:"
          - blockquote [ref=f80e103]:
            - paragraph [ref=f80e104]: "Flight data: FlyItalyADSB (flyitalyadsb.com), CC BY-SA 4.0"
          - paragraph [ref=f80e105]: Works derived from the data that you publish go under the same licence.
          - heading "When you need an agreement" [level=2] [ref=f80e106]
          - paragraph [ref=f80e107]: "An enterprise agreement is only needed for:"
          - list [ref=f80e108]:
            - listitem [ref=f80e109]: reselling the data as an API or feed for other people’s products;
            - listitem [ref=f80e110]: an SLA;
            - listitem [ref=f80e111]: volumes above the Business plan.
          - paragraph [ref=f80e112]:
            - text: Write to
            - link "admin@flyitalyadsb.com" [ref=f80e113] [cursor=pointer]:
              - /url: mailto:admin@flyitalyadsb.com
            - text: .
          - heading "The feeder perk" [level=2] [ref=f80e114]
          - paragraph [ref=f80e115]:
            - text: If you feed the network with a receiver, your Free keys get the Pro plan’s limits for free, but
            - strong [ref=f80e116]: for non-commercial use only
            - text: ": it doesn’t cover products you sell. See"
            - link "Become a feeder" [ref=f80e117] [cursor=pointer]:
              - /url: /en/community/feeder/
            - text: .
