        - heading "Credit Overview" [level=1] [ref=f52e142]
        - generic [ref=f52e143]:
          - generic [ref=f52e145]:
            - paragraph [ref=f52e146]: Our API platform offers a variety of credit packages to suit different user needs. Credits are essential for accessing various API services, and users can choose from subscription credits and top-up credits to manage their API usage efficiently.
            - heading "Types of credits" [level=3] [ref=f52e147]
            - list [ref=f52e148]:
              - listitem [ref=f52e149]:
                - strong [ref=f52e150]: Subscription credits
                - text: ": Granted monthly as part of a subscription plan. Each monthly bundle of subscription credits is valid for one billing month."
              - listitem [ref=f52e151]:
                - strong [ref=f52e152]: Top-up credits
                - text: ": Can be purchased anytime to supplement your existing credit balance. Top-up credits are available in predefined packages. Purchasing larger packages allows you to receive a better discount and a lower price per credit."
                - img "Credits overview in User panel"
            - heading "Credit expiration policy" [level=3] [ref=f52e153]
            - list [ref=f52e154]:
              - listitem [ref=f52e155]:
                - strong [ref=f52e156]: Subscription credits
                - text: are valid for one month. At the end of each billing cycle (after successful payment), any unused subscription credits expire and your balance is replaced with a new bundle of subscription credits for the upcoming month. Subscription credits do not roll over between billing periods.
              - listitem [ref=f52e157]:
                - strong [ref=f52e158]: Top-up credits
                - text: expire 6 months from the date of purchase.
              - listitem [ref=f52e159]: Purchasing or receiving additional top-up credits does not extend the expiration date of previously held top-up credits; each top-up package keeps its original expiry date.
            - heading "Order of credit consumption" [level=3] [ref=f52e160]
            - list [ref=f52e161]:
              - listitem [ref=f52e162]:
                - strong [ref=f52e163]: "Subscription credits:"
                - text: Used first to ensure users maximize their subscription benefits.
              - listitem [ref=f52e164]:
                - strong [ref=f52e165]: "Top-up credits:"
                - text: Used next, following first-in-first-out principles based on their purchase and expiration dates.
            - heading "Subscription tiers" [level=3] [ref=f52e166]
            - paragraph [ref=f52e167]: Each subscription tier comes with a designated amount of credits, tailored to suit varying needs. Higher tiers offer increased benefits such as higher throttling limits, larger result sets per query, access to specific endpoints and history availability.
            - list [ref=f52e168]:
              - listitem [ref=f52e169]:
                - strong [ref=f52e170]: "Explorer:"
                - text: $9/month, 30,000 credits, 10 queries/minute, 30 days of historic data.
              - listitem [ref=f52e171]:
                - strong [ref=f52e172]: "Essential:"
                - text: $90/month, 333,000 credits, 30 queries/minute, 2 years of historic data.
              - listitem [ref=f52e173]:
                - strong [ref=f52e174]: "Advanced:"
                - text: $900/month, 4,050,000 credits, 90 queries/minute, unlimited history data (subject to system availability limits, which vary by endpoint).
