            - heading "Automated credit top-up" [level=2] [ref=f52e400]
            - heading "What is Automated credit top-up?" [level=3] [ref=f52e401]
            - paragraph [ref=f52e402]: Automated credit top-up is a feature designed to ensure that your API usage remains uninterrupted by automatically purchasing additional top-up credits when your credit balance falls below a predefined threshold.
            - heading "Key Features" [level=3] [ref=f52e403]
            - list [ref=f52e404]:
              - listitem [ref=f52e405]:
                - strong [ref=f52e406]: Threshold Setting
                - text: ": Define a minimum credit balance threshold. When your available credits fall below this level, the system will automatically purchase selected, additional top-up credits for you."
              - listitem [ref=f52e407]:
                - strong [ref=f52e408]: Customizable Amounts
                - text: ": Set the amount of top-up credits to be purchased automatically, ensuring it aligns with your usage patterns and budget."
              - listitem [ref=f52e409]:
