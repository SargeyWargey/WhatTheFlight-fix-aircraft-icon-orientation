            - heading "Calculation of the cost of the call" [level=4] [ref=f52e369]
            - paragraph [ref=f52e370]: "Given:"
            - list [ref=f52e371]:
              - listitem [ref=f52e372]: "Credits per returned flight: 8 credits"
              - listitem [ref=f52e373]: "Price per credit: $0.0003 (assuming the highest price per credit)"
            - paragraph [ref=f52e374]:
              - text: Assume the API returns 10 results as specified by the
              - code [ref=f52e375]: limit
              - text: parameter.
            - list [ref=f52e376]:
              - listitem [ref=f52e377]: "Number of results returned: 10"
              - listitem [ref=f52e378]: "Total credits used: 10 results * 8 credits per result = 80 credits"
              - listitem [ref=f52e379]: "Total cost of the call: 80 credits * $0.0003 per credit = $0.024"
            - paragraph [ref=f52e380]: Therefore, if the API returns 10 results, the total cost of the call would be $0.024.
            - blockquote [ref=f52e381]:
              - paragraph [ref=f52e385]: It's important to note that the cost is determined by the number of returned entities, not by the specified limit.
