            - heading "Credit usage optimization" [level=3] [ref=f52e335]
            - heading "Maximize your subscription credits:" [level=4] [ref=f52e336]
            - list [ref=f52e337]:
              - listitem [ref=f52e338]: Plan your API usage to fully utilize your monthly subscription credits before they expire.
              - listitem [ref=f52e339]: Regularly monitor your credit balance and consumption rate.
            - heading "Efficient use of top-up credits:" [level=4] [ref=f52e340]
            - list [ref=f52e341]:
              - listitem [ref=f52e342]: Purchase top-up credits in increments that match your anticipated needs to avoid holding excess credits that may expire.
              - listitem [ref=f52e343]: Utilize Automated top up feature to automatically top-up your account when credit balance is low.
            - heading "Using limit to control credit costs" [level=4] [ref=f52e344]
            - paragraph [ref=f52e345]:
              - text: Utilize the
              - code [ref=f52e346]: limit
              - text: parameter in your API calls to restrict the amount of data retrieved and therefore limit the number of credits consumed. This is particularly useful for large datasets where you only need a subset of the data, allowing you to manage your credit usage more effectively.
            - blockquote [ref=f52e347]:
              - paragraph [ref=f52e351]: The limit parameter is applicable only for flight-positions endpoints.
            - heading [level=4] [ref=f52e352]:
              - text: Example of
              - code [ref=f52e353]: limit
              - text: param usage
            - paragraph [ref=f52e354]:
              - text: The
              - code [ref=f52e355]: limit
              - text: parameter is used to restrict the number of results returned by an API call, thereby controlling credit usage. Below is an example Python script that demonstrates how to use the
              - code [ref=f52e356]: limit
              - text: parameter to restrict the number of results returned by an API call.
            - code [ref=f52e357]:
              - text: "import requests import json # Define the API token and endpoint URL API_TOKEN = '<your_api_token>' BASE_URL = 'https://fr24api.flightradar24.com/api' ENDPOINT = '/historic/flight-positions/full' # Define the headers, including the Authorization header with your API token headers = { 'Accept': 'application/json', 'Authorization': 'Bearer {API_TOKEN}', 'Accept-Version': 'v1' } # Define any query parameters params = { 'bounds': '50.682,46.218,14.422,22.243', 'timestamp': '1702383145', 'limit': 10 } # Construct the full URL url ="
