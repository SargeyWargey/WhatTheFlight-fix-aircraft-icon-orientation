        - paragraph [ref=e35]: iPhone
        - heading "The nearest plane takes the center." [level=2] [ref=e36]
        - paragraph [ref=e37]: Flight number, airline, aircraft type, where it’s from and where it’s going, altitude, speed and how far away it is. Every other aircraft sits on the edge of the screen in its real compass direction, nose pointing the way it’s flying.
        - list [ref=e38]:
          - listitem [ref=e39]: Turn and the sky turns with you. Icons slide around the edge, so whatever’s at the top is in front of you.
          - listitem [ref=e40]: Swipe, tap, hold. Swipe for the next one out, tap any plane to bring it in, hold to pin it.
          - listitem [ref=e41]: Your radius. Anything from 2 to 100 miles.
          - listitem [ref=e42]: Day and night. Paper and ink by day, a night radar after dark.
