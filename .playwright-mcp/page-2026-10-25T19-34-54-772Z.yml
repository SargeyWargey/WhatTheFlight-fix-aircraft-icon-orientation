      - link "weather32 Meteorology Ongoing Upper-troposphere wind measurement from aircraft in flight Commercial aircraft are distributed meteorological sensors at altitude. By extracting wind components from Mode-S messages (BDS50/BDS60) and comparing them against ERA5 reanalysis and IASI satellite profiles, we are validating the quality of avionics data as an independent meteorological source. Method W = Vground − Vair Validation ERA5 · IASI (MetOp) Typical RMSE 6.5–7.4 m/s (u, v) Mode-S vs ERA5 Bias u +0.21 m/s Bias v +1.77 m/s RMSE u 7.38 m/s RMSE v 6.57 m/s Jun 23, 2025" [ref=f74e82] [cursor=pointer]:
